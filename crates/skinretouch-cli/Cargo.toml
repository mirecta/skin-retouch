[package]
name = "skinretouch-cli"
description = "Command-line skin retouch"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skinretouch"
path = "src/main.rs"

[features]
default = ["ai"]
ai = ["skinretouch/ai"]

[dependencies]
skinretouch.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
