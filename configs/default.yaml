# Data
data:
  original_dir: /root/retouch/dataset/images1024x1024
  retouched_dir: /root/retouch/dataset/ffhqr
  patch_size: 256
  num_workers: 8
  pin_memory: true

# Progressive training — [start_epoch, patch_size, batch_size]
progressive:
  - [0,   256, 16]
  - [30,  512,  4]
  - [150, 1024, 2]

# Model
model:
  nf: 128

# Training — ABPN paper (Lei et al., CVPR 2022)
train:
  epochs: 200
  lr_g: 0.0005
  lr_d: 0.0005
  lr_step_epoch: 100
  betas: [0.9, 0.999]
  lambda_mse:  0.5
  lambda_perc: 0.2
  lambda_adv:  0.3
  lambda_dice: 1.0
  lambda_tv:   0.1
  d_steps: 1

# Hardware
hardware:
  device: cuda
  amp: true

# Logging
log:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  save_every: 5
  eval_every: 1
